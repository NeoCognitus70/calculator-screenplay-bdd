# CI gate: every PR and push to main must pass `npm run verify`
# (provider-pin/boundary guards + named provider contract + remaining tests).
#
# Per ADR 0002, package-lock.json resolves the immutable public v0.3.0 provider
# release artefact. A standalone Calculator checkout is therefore sufficient.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The repo's .npmrc points npm's cache at a repo-local dir (a local-machine
  # convenience). Environment config outranks .npmrc, so CI uses a writable
  # container path that actions/setup-node can save and restore.
  npm_config_cache: /tmp/npm-cache

jobs:
  verify:
    name: verify (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Match package-lock.json's Playwright version exactly. The image already
    # contains Chromium and its Linux dependencies, avoiding a host apt mirror
    # dependency before the repository's verification can start.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001
    defaults:
      run:
        working-directory: calculator-screenplay-bdd
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7
        with:
          path: calculator-screenplay-bdd
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: calculator-screenplay-bdd/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify (includes bounded provider contract exactly once)
        run: npm run verify

      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            calculator-screenplay-bdd/playwright-report/
            calculator-screenplay-bdd/test-results/
          if-no-files-found: ignore
          retention-days: 7
